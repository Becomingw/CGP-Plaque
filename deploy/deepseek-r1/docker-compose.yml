version: "3.9"

services:
  deepseek_r1:
    image: ${IMAGE:?Set IMAGE to a model-compatible vLLM image}
    container_name: deepseek-r1-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9990}:9990"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Optional: pin visible GPUs inside container (e.g. 0,1,2,3,4,5,6,7)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}

    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the model weights directory}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-deepseek-r1}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-8}"
      - "--port"
      - "9990"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-120000}"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${TOOL_CALL_PARSER:-hermes}"
      - "--api-key"
      - "${VLLM_API_KEY:?Set VLLM_API_KEY to a private random key}"
      - "--disable-log-requests"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
