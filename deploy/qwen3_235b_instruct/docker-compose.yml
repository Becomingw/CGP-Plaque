version: "3.9"

services:
  qwen3_235b_2507:
    image: ${IMAGE:?Set IMAGE to a model-compatible vLLM image}
    container_name: qwen3-235b-instruct-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9010}:9010"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0,1,2,3}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-32}

    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the model weights directory}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-qwen3_235b_2507}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-4}"
      - "--port"
      - "9010"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-98976}"
      - "--api-key"
      - "${VLLM_API_KEY:?Set VLLM_API_KEY to a private random key}"
      - "--disable-log-requests"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.85}"
