version: "3.9"

services:
  glm4.5:
    image: ${IMAGE:?Set IMAGE to a model-compatible vLLM image}
    container_name: glm-4.5-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9005}:9005"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the model weights directory}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-glm-45}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-8}"
      - "--port"
      - "9005"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-16384}"
      - "--api-key"
      - "${VLLM_API_KEY:?Set VLLM_API_KEY to a private random key}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.7}"
      - "--disable-log-requests"
