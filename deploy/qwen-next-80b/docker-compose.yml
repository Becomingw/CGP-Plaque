version: "3.9"

services:
  qwen_next:
    image: ${IMAGE:?Set IMAGE to a model-compatible vLLM image}
    container_name: qwen-next-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9004}:9004"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-4,5,6,7}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-4,5,6,7}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-32}

    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the model weights directory}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-qwen_next}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-4}"
      - "--port"
      - "9004"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-262144}"
      - "--api-key"
      - "${VLLM_API_KEY:?Set VLLM_API_KEY to a private random key}"
      - "--disable-log-requests"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
