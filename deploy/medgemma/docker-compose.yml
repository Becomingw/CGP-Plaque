version: "3.9"

services:
  gemma3:
    image: ${IMAGE:?Set IMAGE to a model-compatible vLLM image}
    container_name: medgemma3-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9991}:9991"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-2}

    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to the model weights directory}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-medgemma3_27b}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-1}"
      - "--port"
      - "9991"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-120000}"
      - "--enable-prefix-caching"
      - "--api-key"
      - "${VLLM_API_KEY:?Set VLLM_API_KEY to a private random key}"
      - "--disable-log-requests"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
