version: "3.9"

services:
  deepseek_v3:
    image: vllm/vllm-openai:v0.8.4
    container_name: deepseek-v3-model-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${PORT:-9990}:9990"

    shm_size: "${SHM_SIZE:-20gb}"
    ipc: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}

    volumes:
      - ${MODEL_DIR:-/data/models}:/models:ro
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface

    entrypoint:
      - "vllm"
      - "serve"
      - "${MODEL_PATH:-/models/DeepSeek-V3-0324}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME:-deepseek-chat}"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-8}"
      - "--port"
      - "9990"
      - "--max-model-len"
      - "${MAX_MODEL_LEN:-120000}"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${TOOL_CALL_PARSER:-hermes}"
      - "--api-key"
      - "${VLLM_API_KEY:-REPLACE_WITH_YOUR_VLLM_API_KEY}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.95}"

